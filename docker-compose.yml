version: "3.9"

services:
  backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: sh -c "pip install -r requirements.txt && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"

  frontend-mobile:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend-mobile:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3000:3000"

  frontend-dashboard:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend-dashboard:/app
    command: sh -c "npm install && npm start"
    ports:
      - "3001:3001"
